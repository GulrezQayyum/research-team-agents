  <text class="ink label" x="90" y="315">System B</text><text class="ink label" x="1000" y="315">86.7% · 13/15</text><rect class="track box" x="90" y="335" width="1000" height="34"/><rect class="green box" x="90" y="335" width="867" height="34"/>
  <text class="ink label" x="90" y="440">System C</text><text class="ink label" x="1000" y="440">73.3% · 11/15</text><rect class="track box" x="90" y="460" width="1000" height="34"/><rect class="red box" x="90" y="460" width="733" height="34"/>
  <text class="ink small" x="90" y="560">A: 7 invalid tool-call failures   •   B: 1 invalid critic JSON + 1 rate-limit failure   •   C: 3 URL-validation failures + 1 recursion-limit failure</text>
