<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#101214}.panel{fill:#f7f3e9}.ink{fill:#222831;font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#56606b}.label{font-size:21px;font-weight:700}.small{font-size:16px}.box{stroke:#374151;stroke-width:2;rx:16}.purple{fill:#e2c8f2}.green{fill:#bfe8cf}.orange{fill:#f3c7b6}.white{fill:#fff}.line{stroke:#374151;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker></defs>
  <rect class="bg" width="1200" height="720"/><rect class="panel" x="35" y="30" width="1130" height="660" rx="26"/>
  <text class="ink title" x="75" y="82">Evaluation design</text><text class="ink sub" x="75" y="112">A matched 3 × 5 × 3 run design.</text>
  <rect class="purple box" x="80" y="185" width="300" height="300"/><text class="ink label" x="145" y="235">3 systems</text><text class="ink small" x="120" y="280">A  •  single-agent ReAct</text><text class="ink small" x="120" y="320">B  •  fixed pipeline</text><text class="ink small" x="120" y="360">C  •  supervisor workflow</text><text class="ink small" x="120" y="430">Same configured model</text>
  <rect class="green box" x="450" y="185" width="300" height="300"/><text class="ink label" x="540" y="235">5 topics</text><text class="ink small" x="490" y="280">factual biology</text><text class="ink small" x="490" y="320">quantum computing</text><text class="ink small" x="490" y="360">conflicting evidence</text><text class="ink small" x="490" y="400">recent policy</text><text class="ink small" x="490" y="440">niche language</text>
  <rect class="orange box" x="820" y="185" width="300" height="300"/><text class="ink label" x="920" y="235">3 repeats</text><text class="ink small" x="880" y="285">same topic prompts</text><text class="ink small" x="880" y="325">same search tool</text><text class="ink small" x="880" y="365">same run-level metrics</text><text class="ink small" x="880" y="430">15 runs per system</text>
  <path class="line arrow" d="M380 335 L440 335"/><path class="line arrow" d="M750 335 L810 335"/>
  <rect class="white box" x="245" y="545" width="710" height="80"/><text class="ink label" x="470" y="582">45 total evaluation runs</text><text class="ink small" x="365" y="608">completion • failures • tokens • latency • tool calls • citation URLs</text>
</svg>
